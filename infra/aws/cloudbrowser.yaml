AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudBrowser browser VMs (page 10): an outbound-only network for the aws-ec2 executor, and three
  IAM users with fixed rights - runtime (create, start, stop; never delete), reaper (delete only)
  and read-only (reconciler). Every right is limited to resources tagged cb:managed=true.
  Deploy once per region; set CreateAccountResources=false for the second region.

Parameters:
  CreateAccountResources:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Create the IAM users and the budget (account-wide, so only in the first region's stack).
  AllowedRegions:
    Type: CommaDelimitedList
    Default: ap-southeast-2,ap-northeast-1,us-west-2
    Description: Regions the IAM users may act in.
  AllowedInstanceTypes:
    Type: CommaDelimitedList
    Default: c7i-flex.large,c6i.large,c5.large
    Description: Instance types the runtime user may launch (the executor tries them in order). 2 vCPU / 4 GB each.
  BudgetEmail:
    Type: String
    Default: ''
    Description: Email for budget alerts at 50%, 80% and 100% (leave empty to skip the budget).
  MonthlyBudgetUsd:
    Type: Number
    Default: 50

Conditions:
  AccountResources: !Equals [!Ref CreateAccountResources, 'true']
  WithBudget: !And [!Condition AccountResources, !Not [!Equals [!Ref BudgetEmail, '']]]

Resources:
  # --- Network: three zones, no automatic public IPs, no inbound access ------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: cloudbrowser }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: cloudbrowser }]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: cloudbrowser }]
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.40.0.0/20
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: cloudbrowser-a }]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.40.16.0/20
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: cloudbrowser-b }]
  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: 10.40.32.0/20
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: cloudbrowser-c }]
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }
  SubnetCRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetC, RouteTableId: !Ref RouteTable }

  # No inbound rules at all (replies to the VM's own traffic are allowed by the security group's
  # connection tracking). Outbound: everything except mail ports (page 10, "Abuse prevention").
  BrowserSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudBrowser browser VMs - no inbound, no outbound mail
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 24, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 26, ToPort: 464, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 466, ToPort: 586, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 588, ToPort: 65535, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: udp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: cloudbrowser-browser }]

  # --- IAM: one user per credential mode (Workers cannot assume roles) ------------------------
  RuntimePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: AccountResources
    Properties:
      ManagedPolicyName: cloudbrowser-runtime
      Description: Engine worker - create, start, stop and grow tagged browser resources, read prices; never delete.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Read
            Effect: Allow
            Action: ['ec2:Describe*']
            Resource: '*'
            Condition: { StringEquals: { 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: LaunchTaggedInstances
            Effect: Allow
            Action: ['ec2:RunInstances']
            Resource: !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
            Condition:
              StringEquals:
                'aws:RequestTag/cb:managed': 'true'
                'ec2:InstanceType': !Ref AllowedInstanceTypes
                'aws:RequestedRegion': !Ref AllowedRegions
          - Sid: LaunchWithTaggedRootVolume
            Effect: Allow
            Action: ['ec2:RunInstances']
            Resource: !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:volume/*'
            Condition: { StringEquals: { 'aws:RequestTag/cb:managed': 'true', 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: LaunchFromImagesIntoOurInterfaces
            Effect: Allow
            Action: ['ec2:RunInstances']
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:*::image/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*'
            Condition: { StringEquals: { 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: CreateTaggedResources
            Effect: Allow
            Action: ['ec2:CreateVolume', 'ec2:CreateNetworkInterface', 'ec2:AllocateAddress', 'ec2:CreateSnapshot']
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:volume/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:elastic-ip/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*::snapshot/*'
            Condition: { StringEquals: { 'aws:RequestTag/cb:managed': 'true', 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: CreateInterfacesInOurNetwork
            Effect: Allow
            Action: ['ec2:CreateNetworkInterface']
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*'
            Condition: { StringEquals: { 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: UseOurVolumesAndSnapshots
            Effect: Allow
            Action: ['ec2:CreateSnapshot', 'ec2:CreateVolume']
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:volume/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*::snapshot/*'
            Condition: { StringEquals: { 'aws:ResourceTag/cb:managed': 'true', 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: TagOnCreateOnly
            Effect: Allow
            Action: ['ec2:CreateTags']
            Resource: '*'
            Condition:
              StringEquals:
                'ec2:CreateAction': ['RunInstances', 'CreateVolume', 'CreateNetworkInterface', 'AllocateAddress', 'CreateSnapshot']
          - Sid: ReadPrices
            Effect: Allow
            Action: ['pricing:GetProducts']
            Resource: '*'
          - Sid: OperateOurResources
            Effect: Allow
            Action: ['ec2:StartInstances', 'ec2:StopInstances', 'ec2:AttachVolume', 'ec2:DetachVolume', 'ec2:AssociateAddress', 'ec2:ModifyVolume']
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:volume/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:elastic-ip/*'
            Condition: { StringEquals: { 'aws:ResourceTag/cb:managed': 'true', 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: NeverDelete
            Effect: Deny
            Action:
              - 'ec2:TerminateInstances'
              - 'ec2:DeleteVolume'
              - 'ec2:DeleteNetworkInterface'
              - 'ec2:DeleteSnapshot'
              - 'ec2:ReleaseAddress'
              - 'ec2:DisassociateAddress'
              - 'ec2:ModifyInstanceAttribute'
              - 'ec2:DeleteTags'
            Resource: '*'

  ReaperPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: AccountResources
    Properties:
      ManagedPolicyName: cloudbrowser-reaper
      Description: Reaper - stop and delete tagged browser resources; never create.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Read
            Effect: Allow
            Action: ['ec2:Describe*']
            Resource: '*'
            Condition: { StringEquals: { 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: DeleteOurResources
            Effect: Allow
            Action:
              - 'ec2:StopInstances'
              - 'ec2:TerminateInstances'
              - 'ec2:ModifyInstanceAttribute'
              - 'ec2:DetachVolume'
              - 'ec2:DeleteVolume'
              - 'ec2:DeleteNetworkInterface'
              - 'ec2:DisassociateAddress'
              - 'ec2:ReleaseAddress'
              - 'ec2:DeleteSnapshot'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:volume/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:elastic-ip/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*::snapshot/*'
            Condition: { StringEquals: { 'aws:ResourceTag/cb:managed': 'true', 'aws:RequestedRegion': !Ref AllowedRegions } }
          - Sid: NeverCreate
            Effect: Deny
            Action:
              - 'ec2:RunInstances'
              - 'ec2:StartInstances'
              - 'ec2:CreateVolume'
              - 'ec2:CreateNetworkInterface'
              - 'ec2:AllocateAddress'
              - 'ec2:AssociateAddress'
              - 'ec2:CreateSnapshot'
              - 'ec2:CreateTags'
            Resource: '*'

  ReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: AccountResources
    Properties:
      ManagedPolicyName: cloudbrowser-readonly
      Description: Reconciler - describe resources and read quotas.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['ec2:Describe*', 'servicequotas:GetServiceQuota', 'servicequotas:GetAWSDefaultServiceQuota', 'pricing:GetProducts']
            Resource: '*'

  RuntimeUser:
    Type: AWS::IAM::User
    Condition: AccountResources
    Properties: { UserName: cloudbrowser-runtime, ManagedPolicyArns: [!Ref RuntimePolicy] }
  ReaperUser:
    Type: AWS::IAM::User
    Condition: AccountResources
    Properties: { UserName: cloudbrowser-reaper, ManagedPolicyArns: [!Ref ReaperPolicy] }
  ReadOnlyUser:
    Type: AWS::IAM::User
    Condition: AccountResources
    Properties: { UserName: cloudbrowser-readonly, ManagedPolicyArns: [!Ref ReadOnlyPolicy] }

  # --- Spend alerts (page 11, "Spending controls") ------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: WithBudget
    Properties:
      Budget:
        BudgetName: cloudbrowser-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  AwsRegions:
    Description: Value for the engine and reconciler var AWS_REGIONS (merge the objects if you deploy several regions).
    Value: !Sub
      - '{"${AWS::Region}":{"subnets":{"${AzA}":"${SubnetA}","${AzB}":"${SubnetB}","${AzC}":"${SubnetC}"},"securityGroupId":"${BrowserSecurityGroup}"}}'
      - AzA: !GetAtt SubnetA.AvailabilityZone
        AzB: !GetAtt SubnetB.AvailabilityZone
        AzC: !GetAtt SubnetC.AvailabilityZone
  RuntimeUser:
    Condition: AccountResources
    Description: Access key goes to the engine Worker (cloudbrowser-engine).
    Value: !Ref RuntimeUser
  ReaperUser:
    Condition: AccountResources
    Description: Access key goes to the reaper Worker (cloudbrowser-reaper).
    Value: !Ref ReaperUser
  ReadOnlyUser:
    Condition: AccountResources
    Description: Access key goes to the reconciler Worker (cloudbrowser-reconciler).
    Value: !Ref ReadOnlyUser
