name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only read the repository; a compromised step cannot push or touch issues and releases.
permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/agent/go.mod
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: go vet ./...
        working-directory: services/agent
      - run: go test -race ./...
        working-directory: services/agent
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
