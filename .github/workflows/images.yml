# Builds the images the browser VMs run and publishes them to GitHub's container registry:
#   ghcr.io/<owner>/cloudbrowser-browser  neko v3 + Google Chrome (images/browser)
#   ghcr.io/<owner>/cloudbrowser-agent    agent binary + VM files, copied out at first boot (images/agent)
# Tags: `main` (what new VMs use by default) and `sha-<commit>` (to pin with AGENT_IMAGE/BROWSER_IMAGE).
# After the first run, make both packages public once (Packages → package → Package settings).
name: Images

on:
  workflow_dispatch:
  # Weekly, so the browser image picks up each Chrome stable release (about every four weeks,
  # with security updates in between) without waiting for a code change.
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths: ['images/**', 'services/agent/**', '.github/workflows/images.yml']

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: cloudbrowser-browser
            context: images/browser
            file: images/browser/Dockerfile
          - name: cloudbrowser-agent
            context: .
            file: images/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - name: Current Chrome stable
        id: chrome
        # A new release changes the build argument, so the cached Chrome layer is rebuilt.
        run: |
          version=$(curl -fsS 'https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels/stable/versions?pageSize=1' | jq -r '.versions[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: CHROME_VERSION=${{ steps.chrome.outputs.version }}
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:main
            ${{ steps.img.outputs.ref }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
