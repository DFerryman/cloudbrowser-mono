; Overrides neko's Chrome program (verify the path and stock flags against the pinned neko image).
[program:google-chrome]
environment=HOME="/home/neko",USER="neko",DISPLAY=":99.0"
command=/usr/bin/google-chrome
  --user-data-dir=/data/profile
  --password-store=basic
  --disk-cache-size=268435456
  --remote-debugging-address=127.0.0.1
  --remote-debugging-port=9222
  --no-first-run
  --start-maximized
  --disable-dev-shm-usage
stopsignal=INT
autorestart=true
priority=800
user=neko
stdout_logfile=/var/log/neko/google-chrome.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; Openbox handles Chrome's maximize requests and keeps it sized to the remote desktop.
[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
