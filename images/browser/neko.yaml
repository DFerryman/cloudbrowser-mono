# neko v3 configuration (page 5). Confirm the keys against the neko v3 reference for the pinned
# version. Per-VM values (the admin password the agent signs in with, the static IP that WebRTC
# advertises) are NEKO_* environment variables written at each boot by
# images/vm/files/bin/cloudbrowser-browser-env; they are never baked into the image.
desktop:
  screen: "1920x1080@30"
capture:
  video:
    # Without explicit pipelines neko 3.0.8 ignores `codec` and streams its default VP8 pipeline
    # (one quality, about 2 Mbit/s). The ladder below keeps that pipeline as `full` and adds lower
    # ones. Every quality shows the whole desktop, so the viewer shows the same content at the
    # same size; a lower one is a downscaled picture: softer, with less data per hour. Ordered from
    # highest to lowest. The viewer picks one with signal/video (VideoQuality in the contracts),
    # from the browser's setting and, when it adapts, from what it receives. Values are gval
    # expressions printed with %v: a plain 1200000 would reach GStreamer as 1.2e+06, round() not.
    codec: vp8
    ids: [full, high, medium, low]
    pipelines:
      full:
        fps: 25
        gst_encoder: vp8enc
        gst_params: &vp8
          target-bitrate: "round(1996800)"
          end-usage: cbr
          undershoot: "95"
          cpu-used: "4"
          threads: "4"
          deadline: "1"
          buffer-size: "12288"
          buffer-initial-size: "6144"
          buffer-optimal-size: "9216"
          keyframe-max-dist: "25"
          min-quantizer: "4"
          max-quantizer: "20"
      high:
        width: "round(width * 3 / 8) * 2"
        height: "round(height * 3 / 8) * 2"
        fps: 25
        gst_encoder: vp8enc
        gst_params:
          <<: *vp8
          target-bitrate: "round(1200000)"
          max-quantizer: "30"
      medium:
        width: "round(width / 4) * 2"
        height: "round(height / 4) * 2"
        fps: 25
        gst_encoder: vp8enc
        gst_params:
          <<: *vp8
          target-bitrate: "round(700000)"
          max-quantizer: "40"
      low:
        width: "round(width / 4) * 2"
        height: "round(height / 4) * 2"
        fps: 15
        gst_encoder: vp8enc
        gst_params:
          <<: *vp8
          target-bitrate: "round(350000)"
          keyframe-max-dist: "15"
          max-quantizer: "50"
server:
  bind: "127.0.0.1:8080"   # reached only by the agent on the same VM
webrtc:
  icelite: false           # full ICE: the viewer relays through TURN; neko advertises the static IP (NEKO_WEBRTC_NAT1TO1)
  estimator:
    # neko 3.0.8 compares its estimate in bits with the stream rate in bytes, so it only steps
    # down at about an eighth of the needed bandwidth. The viewer adapts the level instead.
    enabled: false
member:
  provider: multiuser      # the agent signs in as admin with the VM's password; viewers never see it
session:
  implicit_hosting: true
  merciful_reconnect: true
